openapi: 3.1.0
info:
  title: Nebula Chat API
  version: 1.9.0
  description: REST API for Nebula Chat
  contact:
    name: Nebula Chat
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    operatorToken:
      type: http
      scheme: bearer
  schemas:
    ApiRoot:
      type: object
      properties:
        message:
          type: string
      required:
        - message
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
      required:
        - status
        - timestamp
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
      required:
        - success
        - error
        - message
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
        - BadRequest
        - Validation
        - Unauthorized
        - Forbidden
        - MessageAllowanceReached
        - NotFound
        - Conflict
        - PayloadTooLarge
        - TooManyRequests
        - Internal
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - title
        - createdAt
      additionalProperties: false
    ConversationPage:
      type: object
      properties:
        conversations:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
        hasMore:
          type: boolean
      required:
        - conversations
        - nextCursor
        - hasMore
      additionalProperties: false
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        conversationId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        content:
          type: string
        role:
          type: string
        tokenCount:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: 'null'
        cached:
          type: boolean
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - conversationId
        - content
        - role
        - tokenCount
        - cached
        - createdAt
      additionalProperties: false
    LogLevelChange:
      type: object
      properties:
        receivers:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: How many server instances received the change
        expiresAt:
          description: When the change reverts
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - receivers
        - expiresAt
      additionalProperties: false
paths:
  /:
    get:
      operationId: getApiRoot
      summary: API root
      tags:
        - Health
      description: Welcome endpoint — confirms the API is reachable.
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      description: Returns server liveness status and current UTC timestamp.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/chat/stream:
    post:
      operationId: streamChat
      summary: Stream chat completion
      tags:
        - Chat
      description: Stream a chat completion response from an AI model with automatic
        conversation and message persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  minItems: 1
                  maxItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                          - system
                      content:
                        type: string
                        minLength: 1
                    required:
                      - role
                      - content
                model:
                  type: string
                conversationId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                regenerate:
                  default: false
                  description: Bypass and overwrite any cached response, forcing a fresh
                    completion
                  type: boolean
              required:
                - messages
                - model
      responses:
        '200':
          description: Streamed SSE events
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Guest message allowance reached — registration required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Message or context exceeds token limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/conversations:
    post:
      operationId: createConversation
      summary: Create conversation
      tags:
        - Conversations
      description: Create a new conversation with a title
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
              required:
                - title
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listConversations
      summary: List conversations
      tags:
        - Conversations
      description: Retrieve the caller’s own conversations with cursor-based
        pagination. Returns up to 10 conversations by default.
      parameters:
        - schema:
            default: 10
            description: Number of conversations to fetch (1-100, default 10)
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          description: Number of conversations to fetch (1-100, default 10)
        - schema:
            description: Pagination cursor for fetching the next page of conversations
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: cursor
          description: Pagination cursor for fetching the next page of conversations
      responses:
        '200':
          description: Paginated list of conversations owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/conversations/search:
    get:
      operationId: searchConversations
      summary: Search conversations
      tags:
        - Conversations
      description: Search the caller’s own conversations by title, ordered by creation date.
      parameters:
        - schema:
            type: string
            minLength: 1
            description: Search query to filter conversations by title
          in: query
          name: q
          required: true
          description: Search query to filter conversations by title
      responses:
        '200':
          description: Matching conversations owned by the caller
          content:
            application/json:
              schema:
                maxItems: 100
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Get conversation by ID
      tags:
        - Conversations
      description: Retrieve one of the caller’s own conversations by ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: conversationId
          required: true
      responses:
        '200':
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Invalid conversation ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/messages:
    post:
      operationId: createMessage
      summary: Create message
      tags:
        - Messages
      description: Create a new message in one of the caller’s own conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                role:
                  type: string
                  enum:
                    - user
                    - assistant
                    - system
                content:
                  type: string
                  minLength: 1
                tokenCount:
                  anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
              required:
                - conversationId
                - role
                - content
      responses:
        '201':
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listMessages
      summary: List messages
      tags:
        - Messages
      description: Retrieve the messages across the caller’s own conversations, newest
        first. Pass `conversationId` to list one conversation’s messages, oldest
        first; a conversation the caller does not own lists as empty.
      parameters:
        - schema:
            description: Only list the messages of this conversation, oldest first
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: conversationId
          description: Only list the messages of this conversation, oldest first
      responses:
        '200':
          description: List of messages owned by the caller
          content:
            application/json:
              schema:
                maxItems: 1000
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          description: Invalid conversation ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get message by ID
      tags:
        - Messages
      description: Retrieve one of the caller’s own messages by ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: messageId
          required: true
      responses:
        '200':
          description: Message retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid message ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Message not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/internal/log-level:
    post:
      operationId: changeLogLevel
      summary: Change log level
      tags:
        - Operator
      description: Change the root log level, or one component's, on every running
        server instance. It reverts to the boot-time level after `ttlSeconds`.
        Requires the operator token, not a User session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                component:
                  description: The `nebula.component` to change; omit it to change the root level
                  type: string
                  enum:
                    - auth
                    - chat
                    - http
                    - llm
                    - otel
                    - redis
                level:
                  type: string
                  enum:
                    - fatal
                    - error
                    - warn
                    - info
                    - debug
                    - trace
                ttlSeconds:
                  default: 900
                  description: How long the change holds before the boot-time level returns
                  type: integer
                  minimum: 1
                  maximum: 14400
                operator:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Who is asking, recorded on the lines that log the change
              required:
                - level
                - operator
      security:
        - operatorToken: []
      responses:
        '202':
          description: Change sent to every server instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelChange'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing or wrong operator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No operator token is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Chat
    description: Chat streaming endpoints
  - name: Conversations
    description: Conversation management
  - name: Messages
    description: Message management
  - name: Operator
    description: Operations for whoever runs the deployment
