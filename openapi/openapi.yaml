openapi: 3.1.0
info:
  title: Nebula Chat API
  version: 4.3.0
  description: REST API for Nebula Chat
  contact:
    name: Nebula Chat
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    operatorToken:
      type: http
      scheme: bearer
  schemas:
    ApiRoot:
      type: object
      properties:
        message:
          type: string
      required:
        - message
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
      required:
        - status
        - timestamp
      additionalProperties: false
    SentMessage:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: The persisted user Message
        streamId:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: The reply stream to read from `GET /api/streams/{streamId}`
        runId:
          description: The Run producing the reply; only in `run` mode
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - messageId
        - streamId
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
      required:
        - success
        - error
        - message
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
        - BadRequest
        - Validation
        - Unauthorized
        - Forbidden
        - MessageAllowanceReached
        - NotFound
        - Conflict
        - PayloadTooLarge
        - TooManyRequests
        - Internal
    MessageAllowance:
      oneOf:
        - $ref: '#/components/schemas/MeteredMessageAllowance'
        - $ref: '#/components/schemas/UnmeteredMessageAllowance'
      type: object
      discriminator:
        propertyName: metered
        mapping:
          'true': '#/components/schemas/MeteredMessageAllowance'
          'false': '#/components/schemas/UnmeteredMessageAllowance'
    MeteredMessageAllowance:
      type: object
      properties:
        metered:
          type: boolean
          const: true
        limit:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The configured message allowance
        used:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The caller's live user-message count
        remaining:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Messages left before the allowance is spent, clamped at 0
      required:
        - metered
        - limit
        - used
        - remaining
      additionalProperties: false
    UnmeteredMessageAllowance:
      type: object
      properties:
        metered:
          type: boolean
          const: false
      required:
        - metered
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - title
        - createdAt
      additionalProperties: false
    SessionDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        activeStreamId:
          anyOf:
            - type: string
              format: uuid
              pattern: >-
                ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
          description: >-
            The reply still being produced for this Session, to re-attach to
            with `GET /api/streams/{streamId}`; null when none is in flight
      required:
        - id
        - title
        - createdAt
        - activeStreamId
      additionalProperties: false
    SessionPage:
      type: object
      properties:
        sessions:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/Session'
        nextCursor:
          anyOf:
            - type: string
              format: uuid
              pattern: >-
                ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
        hasMore:
          type: boolean
      required:
        - sessions
        - nextCursor
        - hasMore
      additionalProperties: false
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        sessionId:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        content:
          type: string
        role:
          type: string
        tokenCount:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: 'null'
        cached:
          type: boolean
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - sessionId
        - content
        - role
        - tokenCount
        - cached
        - createdAt
      additionalProperties: false
    ModelCatalog:
      type: object
      properties:
        version:
          type: string
          description: '`YYYY-MM-DD-<uuid>`: changes whenever the catalog does'
        hash:
          type: string
          description: SHA-256 of the catalog content (Models and defaults)
        models:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/Model'
      required:
        - version
        - hash
        - models
      additionalProperties: false
    Model:
      type: object
      properties:
        id:
          type: string
          enum:
            - gpt-4o
            - gpt-4o-mini
            - gpt-4-turbo
            - gpt-4.1
            - gpt-4.1-mini
            - gpt-5
            - gpt-5-mini
            - gpt-5.6-luna
            - claude-3-5-sonnet-20241022
            - claude-3-5-haiku-20241022
            - claude-3-opus-20240229
        label:
          type: string
          description: The name people see, e.g. "GPT-4.1 mini"
        provider:
          type: string
          enum:
            - openai
            - anthropic
        contextWindow:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Tokens the Model can take in
        maxOutput:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Tokens reserved for a reply
        prices:
          $ref: '#/components/schemas/ModelPrices'
      required:
        - id
        - label
        - provider
        - contextWindow
        - maxOutput
        - prices
      additionalProperties: false
    ModelPrices:
      type: object
      properties:
        input:
          type: number
          description: USD per million input tokens
        cachedInput:
          type: number
          description: USD per million input tokens served from the prompt cache
        output:
          type: number
          description: USD per million output tokens
      required:
        - input
        - cachedInput
        - output
      additionalProperties: false
    ProfileImageSettings:
      type: object
      properties:
        uploadsEnabled:
          type: boolean
          description: >-
            Whether this server can store uploads; removing an image works
            either way
      required:
        - uploadsEnabled
      additionalProperties: false
    ProfileImage:
      type: object
      properties:
        image:
          type: string
          format: uri
          description: The public URL of the processed 256×256 WebP
      required:
        - image
      additionalProperties: false
    LogLevelReports:
      type: object
      properties:
        receivers:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: >-
            How many server instances received the request; more than reports
            means some did not answer in time
        reports:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/LogLevelReport'
          description: One per instance that answered, by instance
      required:
        - receivers
        - reports
      additionalProperties: false
    LogLevelReport:
      type: object
      properties:
        instance:
          type: string
          description: The server instance, as its hostname and process id
        levels:
          maxItems: 7
          type: array
          items:
            $ref: '#/components/schemas/LogLevelState'
          description: The root level, then every component
      required:
        - instance
        - levels
      additionalProperties: false
    LogLevelState:
      type: object
      properties:
        target:
          type: string
          enum:
            - root
            - auth
            - chat
            - http
            - llm
            - otel
            - redis
          description: The root level, or the `nebula.component` this level applies to
        level:
          type: string
          enum:
            - fatal
            - error
            - warn
            - info
            - debug
            - trace
            - silent
        expiresAt:
          anyOf:
            - type: string
              format: date-time
              pattern: >-
                ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            - type: 'null'
          description: When the runtime change reverts; `null` at the boot-time level
        operator:
          description: Who asked for the runtime change; `null` at the boot-time level
          type:
            - string
            - 'null'
      required:
        - target
        - level
        - expiresAt
        - operator
      additionalProperties: false
    LogLevelChange:
      type: object
      properties:
        receivers:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: How many server instances received the change
        expiresAt:
          description: When the change reverts
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - receivers
        - expiresAt
      additionalProperties: false
paths:
  /:
    get:
      operationId: getApiRoot
      summary: API root
      tags:
        - Health
      description: Welcome endpoint — confirms the API is reachable.
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      description: Returns server liveness status and current UTC timestamp.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/sessions/{sessionId}/messages:
    post:
      operationId: sendMessage
      summary: Send message
      tags:
        - Chat
      description: >-
        Send a user Message to one of the caller’s own Sessions. The Message is
        persisted and its reply is queued; nothing waits on the model. Read the
        reply as server-sent events from `GET /api/streams/{streamId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                mode:
                  type: string
                  enum:
                    - direct
                    - run
                  description: >-
                    How the reply is produced: `direct`, a Direct reply, or
                    `run`, a Run (Registered users only).
                model:
                  description: >-
                    Binds the Session to this Model before replying; omitted
                    keeps the Session's Model
                  type: string
                  enum:
                    - gpt-4o
                    - gpt-4o-mini
                    - gpt-4-turbo
                    - gpt-4.1
                    - gpt-4.1-mini
                    - gpt-5
                    - gpt-5-mini
                    - gpt-5.6-luna
                    - claude-3-5-sonnet-20241022
                    - claude-3-5-haiku-20241022
                    - claude-3-opus-20240229
              required:
                - content
                - mode
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: sessionId
          required: true
      responses:
        '202':
          description: Message persisted and its reply queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          description: Invalid request body or session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Guest message allowance reached, or a Guest asked for a Run —
            registration required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Message exceeds the prompt token limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/chat/message-allowance:
    get:
      operationId: getMessageAllowance
      summary: Get message allowance
      tags:
        - Chat
      description: >-
        How much of the caller's message allowance is left. Metered users
        (Guests and unverified Registered users) get their limit, live count and
        remaining sends; verified Registered users get `metered: false`.
      responses:
        '200':
          description: The caller's message allowance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAllowance'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/sessions:
    post:
      operationId: createSession
      summary: Create session
      tags:
        - Sessions
      description: Create a new session with a title
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
              required:
                - title
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listSessions
      summary: List sessions
      tags:
        - Sessions
      description: >-
        Retrieve the caller’s own sessions with cursor-based pagination. Returns
        up to 10 sessions by default.
      parameters:
        - schema:
            default: 10
            description: Number of sessions to fetch (1-100, default 10)
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          description: Number of sessions to fetch (1-100, default 10)
        - schema:
            description: Pagination cursor for fetching the next page of sessions
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: cursor
          description: Pagination cursor for fetching the next page of sessions
      responses:
        '200':
          description: Paginated list of sessions owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/sessions/search:
    get:
      operationId: searchSessions
      summary: Search sessions
      tags:
        - Sessions
      description: Search the caller’s own sessions by title, ordered by creation date.
      parameters:
        - schema:
            type: string
            minLength: 1
            description: Search query to filter sessions by title
          in: query
          name: q
          required: true
          description: Search query to filter sessions by title
      responses:
        '200':
          description: Matching sessions owned by the caller
          content:
            application/json:
              schema:
                maxItems: 100
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get session by ID
      tags:
        - Sessions
      description: Retrieve one of the caller’s own sessions by ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: sessionId
          required: true
      responses:
        '200':
          description: Session retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/messages:
    post:
      operationId: createMessage
      summary: Create message
      tags:
        - Messages
      description: Create a new message in one of the caller’s own sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  format: uuid
                  pattern: >-
                    ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                role:
                  type: string
                  enum:
                    - user
                    - assistant
                content:
                  type: string
                  minLength: 1
                tokenCount:
                  anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
              required:
                - sessionId
                - role
                - content
      responses:
        '201':
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listMessages
      summary: List messages
      tags:
        - Messages
      description: >-
        Retrieve the messages across the caller’s own sessions, newest first.
        Pass `sessionId` to list one session’s messages, oldest first; a session
        the caller does not own lists as empty.
      parameters:
        - schema:
            description: Only list the messages of this session, oldest first
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: sessionId
          description: Only list the messages of this session, oldest first
      responses:
        '200':
          description: List of messages owned by the caller
          content:
            application/json:
              schema:
                maxItems: 1000
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get message by ID
      tags:
        - Messages
      description: Retrieve one of the caller’s own messages by ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: messageId
          required: true
      responses:
        '200':
          description: Message retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid message ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Message not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/models:
    get:
      operationId: getModelCatalog
      summary: Get the model catalog
      tags:
        - Models
      description: >-
        The model catalog: the Models a Session can be bound to, with their
        labels, limits and list prices (USD per million tokens), plus the
        catalog version and content hash
      responses:
        '200':
          description: The model catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalog'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/streams/{streamId}:
    get:
      operationId: readReplyStream
      summary: Read reply stream
      tags:
        - Streams
      description: >-
        Relay a reply stream as server-sent events, from its first event (or
        after `Last-Event-ID`) to its `end` (ADR-0014). Only the User who sent
        the Message may read it. A stream that has expired answers 404: read the
        persisted Message instead.
      parameters:
        - schema:
            description: Resume after this event id, for a client reconnecting by hand
            type: string
            pattern: ^\d+-\d+$
          in: query
          name: lastEventId
          description: Resume after this event id, for a client reconnecting by hand
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: streamId
          required: true
        - schema:
            description: >-
              Resume after this event id; sent by an EventSource when it
              reconnects
            type: string
            pattern: ^\d+-\d+$
          in: header
          name: last-event-id
          description: >-
            Resume after this event id; sent by an EventSource when it
            reconnects
      responses:
        '200':
          description: The reply stream, as server-sent events
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Server-sent events: `token` ({ token }), `usage` ({
                  promptTokens, completionTokens, totalTokens }), `error` (the
                  ErrorEnvelope) and a final `end` ({}, or { reason: 'cancelled'
                  } for a reply its User stopped). Each event `id` is its stream
                  entry id; send the last one back as `Last-Event-ID` (or
                  `lastEventId`) to resume after it.
        '400':
          description: Invalid stream ID or Last-Event-ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Stream not found, expired, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/streams/{streamId}/cancel:
    post:
      operationId: cancelReplyStream
      summary: Cancel reply stream
      tags:
        - Streams
      description: >-
        Stop a Direct reply in flight: the worker aborts the model call,
        persists what it had produced and ends the stream with `end` { reason:
        "cancelled" }. Cancelling a reply that already finished does nothing.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: streamId
          required: true
      responses:
        '204':
          description: Stop requested, or the reply had already finished
        '400':
          description: Invalid stream ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Stream not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/profile-image/settings:
    get:
      operationId: getProfileImageSettings
      summary: Get Profile image settings
      tags:
        - Profile image
      description: Whether this server can store Profile image uploads.
      responses:
        '200':
          description: Profile image settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileImageSettings'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/profile-image:
    put:
      operationId: uploadProfileImage
      summary: Upload Profile image
      tags:
        - Profile image
      description: >-
        Set the Registered user's Profile image from a JPEG, PNG or WebP of up
        to 5 MB, sent as the raw request body. It is stored as a 256×256 WebP;
        the previous upload is deleted.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Profile image stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileImage'
        '400':
          description: The file is not a JPEG, PNG or WebP image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: A Guest cannot set a Profile image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Profile image uploads are switched off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: The file is larger than 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: The body is not a JPEG, PNG or WebP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many uploads this hour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: removeProfileImage
      summary: Remove Profile image
      tags:
        - Profile image
      description: >-
        Remove the Registered user's Profile image, so their Avatar shows
        initials. Succeeds when there is none.
      responses:
        '204':
          description: Profile image removed
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: A Guest cannot have a Profile image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/internal/log-level:
    get:
      operationId: getLogLevels
      summary: Get log levels
      tags:
        - Operator
      description: >-
        Report the root log level and every component's, with the expiry and
        operator of any runtime change, from every running server instance. Each
        instance answers for itself; one that does not answer within 2 seconds
        is left out, so `receivers` exceeds the number of reports. Requires the
        operator token, not a User session.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The levels each server instance applies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelReports'
        '403':
          description: Missing or wrong operator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No operator token is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: changeLogLevel
      summary: Change log level
      tags:
        - Operator
      description: >-
        Change the root log level, or one component's, on every running server
        instance. It reverts to the boot-time level after `ttlSeconds`. Requires
        the operator token, not a User session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                component:
                  description: >-
                    The `nebula.component` to change; omit it to change the root
                    level
                  type: string
                  enum:
                    - auth
                    - chat
                    - http
                    - llm
                    - otel
                    - redis
                level:
                  type: string
                  enum:
                    - fatal
                    - error
                    - warn
                    - info
                    - debug
                    - trace
                ttlSeconds:
                  default: 900
                  description: How long the change holds before the boot-time level returns
                  type: integer
                  minimum: 1
                  maximum: 14400
                operator:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Who is asking, recorded on the lines that log the change
              required:
                - level
                - operator
      security:
        - operatorToken: []
      responses:
        '202':
          description: Change sent to every server instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelChange'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing or wrong operator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No operator token is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Chat
    description: Sending Messages and the message allowance
  - name: Streams
    description: Reply streams, relayed as server-sent events
  - name: Sessions
    description: Session management
  - name: Messages
    description: Message management
  - name: Models
    description: 'The model catalog: Models, limits and prices'
  - name: Profile image
    description: A Registered user's Profile image
  - name: Operator
    description: Operations for whoever runs the deployment
