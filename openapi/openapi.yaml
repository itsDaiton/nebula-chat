                    pattern: >-
                      ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  conversationId:
                    type: string
                    format: uuid
                    pattern: >-
                      ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  content:
                    type: string
                  role:
                    type: string
                  tokenCount:
                    nullable: true
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  cached:
                    type: boolean
                  createdAt: {}
                required:
                  - id
                  - conversationId
                  - content
                  - role
                  - tokenCount
                  - cached
                  - createdAt
                additionalProperties: false
                description: Message retrieved successfully
        '400':
          description: Invalid message ID format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - success
                  - error
                  - message
                additionalProperties: false
                description: Invalid message ID format
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - success
                  - error
                  - message
                additionalProperties: false
                description: Message not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - success
                  - error
                  - message
                additionalProperties: false
                description: Internal server error
servers:
  - url: http://localhost:3000
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Chat
    description: Chat streaming endpoints
  - name: Conversations
    description: Conversation management
  - name: Messages
    description: Message management
