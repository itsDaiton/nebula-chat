openapi: 3.0.0
info:
  title: Nebula Chat API
  version: 1.7.0
  description: REST API for Nebula Chat
  contact:
    name: Nebula Chat
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    GeneralErrorCode:
      type: string
      enum:
        - BadRequest
        - Validation
        - Unauthorized
        - Forbidden
        - NotFound
        - Conflict
        - PayloadTooLarge
        - TooManyRequests
        - Internal
    MessageAllowanceDetails:
      type: object
      properties:
        limit:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - limit
        - count
      additionalProperties: false
    ErrorEnvelope:
      oneOf:
        - type: object
          properties:
            success:
              type: boolean
              enum:
                - false
            error:
              $ref: '#/components/schemas/GeneralErrorCode'
            message:
              type: string
          required:
            - success
            - error
            - message
          additionalProperties: false
        - type: object
          properties:
            success:
              type: boolean
              enum:
                - false
            error:
              type: string
              enum:
                - MessageAllowanceReached
            message:
              type: string
            details:
              $ref: '#/components/schemas/MessageAllowanceDetails'
          required:
            - success
            - error
            - message
            - details
          additionalProperties: false
paths:
  /:
    get:
      operationId: getApiRoot
      summary: API root
      tags:
        - Health
      description: Welcome endpoint — confirms the API is reachable.
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
                additionalProperties: false
                description: API is reachable
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      description: Returns server liveness status and current UTC timestamp.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  timestamp:
                    type: string
                required:
                  - status
                  - timestamp
                additionalProperties: false
                description: Server is healthy
  /api/chat/stream:
    post:
      operationId: streamChat
      summary: Stream chat completion
      tags:
        - Chat
      description: Stream a chat completion response from an AI model with automatic
        conversation and message persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  minItems: 1
                  maxItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                          - system
                      content:
                        type: string
                        minLength: 1
                    required:
                      - role
                      - content
                model:
                  type: string
                conversationId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                regenerate:
                  default: false
                  description: Bypass and overwrite any cached response, forcing a fresh
                    completion
                  type: boolean
              required:
                - messages
                - model
      responses:
        '200':
          description: Streamed SSE events
          content:
            application/json:
              schema:
                type: string
                description: Streamed SSE events
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                description: Invalid request body or validation error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                description: No authenticated session
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Guest message allowance reached — registration required
          content:
            application/json:
              schema:
                description: Guest message allowance reached — registration required
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                description: Conversation not found
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Message or context exceeds token limit
          content:
            application/json:
              schema:
                description: Message or context exceeds token limit
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                description: Rate limit exceeded
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Internal server error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/conversations:
    post:
      operationId: createConversation
      summary: Create conversation
      tags:
        - Conversations
      description: Create a new conversation with a title
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
              required:
                - title
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  title:
                    type: string
                  createdAt: {}
                required:
                  - id
                  - title
                  - createdAt
                additionalProperties: false
                description: Conversation created successfully
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                description: Invalid request body
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                description: No authenticated session
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Internal server error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listConversations
      summary: List conversations
      tags:
        - Conversations
      description: Retrieve the caller’s own conversations with cursor-based
        pagination. Returns up to 10 conversations by default.
      parameters:
        - schema:
            default: 10
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          required: false
          description: Number of conversations to fetch (1-100, default 10)
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: cursor
          required: false
          description: Pagination cursor for fetching the next page of conversations
      responses:
        '200':
          description: Paginated list of conversations owned by the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    maxItems: 100
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        title:
                          type: string
                        createdAt: {}
                      required:
                        - id
                        - title
                        - createdAt
                      additionalProperties: false
                  nextCursor:
                    nullable: true
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  hasMore:
                    type: boolean
                required:
                  - conversations
                  - nextCursor
                  - hasMore
                additionalProperties: false
                description: Paginated list of conversations owned by the caller
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                description: No authenticated session
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Internal server error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/conversations/search:
    get:
      operationId: searchConversations
      summary: Search conversations
      tags:
        - Conversations
      description: Search the caller’s own conversations by title, ordered by creation date.
      parameters:
        - schema:
            type: string
            minLength: 1
          in: query
          name: q
          required: true
          description: Search query to filter conversations by title
      responses:
        '200':
          description: Matching conversations owned by the caller
          content:
            application/json:
              schema:
                maxItems: 100
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    title:
                      type: string
                    createdAt: {}
                  required:
                    - id
                    - title
                    - createdAt
                  additionalProperties: false
                description: Matching conversations owned by the caller
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                description: Invalid search query
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                description: No authenticated session
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Internal server error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Get conversation by ID
      tags:
        - Conversations
      description: Retrieve one of the caller’s own conversations by ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: conversationId
          required: true
      responses:
        '200':
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  title:
                    type: string
                  createdAt: {}
                required:
                  - id
                  - title
                  - createdAt
                additionalProperties: false
                description: Conversation retrieved successfully
        '400':
          description: Invalid conversation ID format
          content:
            application/json:
              schema:
                description: Invalid conversation ID format
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                description: No authenticated session
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found or not owned by the caller
          content:
            application/json:
              schema:
                description: Conversation not found or not owned by the caller
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Internal server error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/messages:
    post:
      operationId: createMessage
      summary: Create message
      tags:
        - Messages
      description: Create a new message in one of the caller’s own conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                role:
                  type: string
                  enum:
                    - user
                    - assistant
                    - system
                content:
                  type: string
                  minLength: 1
                tokenCount:
                  nullable: true
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - conversationId
                - role
                - content
      responses:
        '201':
          description: Message created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  conversationId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  content:
                    type: string
                  role:
                    type: string
                  tokenCount:
                    nullable: true
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  cached:
                    type: boolean
                  createdAt: {}
                required:
                  - id
                  - conversationId
                  - content
                  - role
                  - tokenCount
                  - cached
                  - createdAt
                additionalProperties: false
                description: Message created successfully
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                description: Invalid request body
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                description: No authenticated session
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found or not owned by the caller
          content:
            application/json:
              schema:
                description: Conversation not found or not owned by the caller
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Internal server error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listMessages
      summary: List messages
      tags:
        - Messages
      description: Retrieve all messages across the caller’s own conversations
      responses:
        '200':
          description: List of messages owned by the caller
          content:
            application/json:
              schema:
                maxItems: 1000
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    conversationId:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    content:
                      type: string
                    role:
                      type: string
                    tokenCount:
                      nullable: true
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    cached:
                      type: boolean
                    createdAt: {}
                  required:
                    - id
                    - conversationId
                    - content
                    - role
                    - tokenCount
                    - cached
                    - createdAt
                  additionalProperties: false
                description: List of messages owned by the caller
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                description: No authenticated session
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Internal server error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get message by ID
      tags:
        - Messages
      description: Retrieve one of the caller’s own messages by ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: messageId
          required: true
      responses:
        '200':
          description: Message retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  conversationId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  content:
                    type: string
                  role:
                    type: string
                  tokenCount:
                    nullable: true
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  cached:
                    type: boolean
                  createdAt: {}
                required:
                  - id
                  - conversationId
                  - content
                  - role
                  - tokenCount
                  - cached
                  - createdAt
                additionalProperties: false
                description: Message retrieved successfully
        '400':
          description: Invalid message ID format
          content:
            application/json:
              schema:
                description: Invalid message ID format
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No authenticated session
          content:
            application/json:
              schema:
                description: No authenticated session
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Message not found or not owned by the caller
          content:
            application/json:
              schema:
                description: Message not found or not owned by the caller
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Internal server error
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
servers:
  - url: http://localhost:3000
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Chat
    description: Chat streaming endpoints
  - name: Conversations
    description: Conversation management
  - name: Messages
    description: Message management
