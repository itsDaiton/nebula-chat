openapi: 3.1.0
info:
  title: Nebula Chat API
  version: 4.9.0
  description: REST API for Nebula Chat
  contact:
    name: Nebula Chat
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    operatorToken:
      type: http
      scheme: bearer
  schemas:
    ApiRoot:
      type: object
      properties:
        message:
          type: string
      required:
        - message
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
      required:
        - status
        - timestamp
      additionalProperties: false
    SentMessage:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: The persisted user Message
        streamId:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: The reply stream to read from `GET /api/streams/{streamId}`
        runId:
          description: The Run producing the reply; only in `run` mode
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - messageId
        - streamId
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
      required:
        - success
        - error
        - message
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
        - BadRequest
        - Validation
        - Unauthorized
        - Forbidden
        - MessageAllowanceReached
        - TwoFactorRequired
        - NotFound
        - Conflict
        - LastAdmin
        - NotEligibleForAdmin
        - PayloadTooLarge
        - TooManyRequests
        - Internal
    MessageAllowance:
      oneOf:
        - $ref: '#/components/schemas/MeteredMessageAllowance'
        - $ref: '#/components/schemas/UnmeteredMessageAllowance'
      type: object
      discriminator:
        propertyName: metered
        mapping:
          'true': '#/components/schemas/MeteredMessageAllowance'
          'false': '#/components/schemas/UnmeteredMessageAllowance'
    MeteredMessageAllowance:
      type: object
      properties:
        metered:
          type: boolean
          const: true
        limit:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The configured message allowance
        used:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The caller's live user-message count
        remaining:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Messages left before the allowance is spent, clamped at 0
      required:
        - metered
        - limit
        - used
        - remaining
      additionalProperties: false
    UnmeteredMessageAllowance:
      type: object
      properties:
        metered:
          type: boolean
          const: false
      required:
        - metered
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        archived:
          type: boolean
          description: Whether the owner has archived this Session
      required:
        - id
        - title
        - createdAt
        - archived
      additionalProperties: false
    SessionSearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        archived:
          type: boolean
          description: Whether the owner has archived this Session
        snippet:
          description: >-
            Text around the first match in one of the Session’s Messages,
            ellipsised where cut; absent when only the title matched
          type: string
      required:
        - id
        - title
        - createdAt
        - archived
      additionalProperties: false
    SessionDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        archived:
          type: boolean
          description: Whether the owner has archived this Session
        activeStreamId:
          anyOf:
            - type: string
              format: uuid
              pattern: >-
                ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
          description: >-
            The reply still being produced for this Session, to re-attach to
            with `GET /api/streams/{streamId}`; null when none is in flight
      required:
        - id
        - title
        - createdAt
        - archived
        - activeStreamId
      additionalProperties: false
    SessionPage:
      type: object
      properties:
        sessions:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/Session'
        nextCursor:
          anyOf:
            - type: string
              format: uuid
              pattern: >-
                ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
        hasMore:
          type: boolean
      required:
        - sessions
        - nextCursor
        - hasMore
      additionalProperties: false
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        sessionId:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        content:
          type: string
        role:
          type: string
        tokenCount:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: 'null'
        cached:
          type: boolean
        model:
          description: The Model that wrote a Direct reply; null for a Run answer
          type:
            - string
            - 'null'
        estimatedCostUsd:
          description: >-
            Estimated cost in USD; for a Run answer, the sum of the Run’s Model
            calls
          type:
            - number
            - 'null'
        runId:
          anyOf:
            - type: string
              format: uuid
              pattern: >-
                ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
          description: The Run that produced this Message
        contextTokens:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: 'null'
          description: Input tokens of a Direct reply’s request
        contextMessages:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: 'null'
          description: History Messages sent with a Direct reply
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - sessionId
        - content
        - role
        - tokenCount
        - cached
        - model
        - estimatedCostUsd
        - runId
        - contextTokens
        - contextMessages
        - createdAt
      additionalProperties: false
    ModelCatalog:
      type: object
      properties:
        version:
          type: string
          description: '`YYYY-MM-DD-<uuid>`: changes whenever the catalog does'
        hash:
          type: string
          description: SHA-256 of the catalog content (Models and defaults)
        models:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/Model'
      required:
        - version
        - hash
        - models
      additionalProperties: false
    Model:
      type: object
      properties:
        id:
          type: string
          enum:
            - gpt-4o
            - gpt-4o-mini
            - gpt-4-turbo
            - gpt-4.1
            - gpt-4.1-mini
            - gpt-5
            - gpt-5-mini
            - gpt-5.6-luna
            - claude-3-5-sonnet-20241022
            - claude-3-5-haiku-20241022
            - claude-3-opus-20240229
        label:
          type: string
          description: The name people see, e.g. "GPT-4.1 mini"
        provider:
          type: string
          enum:
            - openai
            - anthropic
        contextWindow:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Tokens the Model can take in
        maxOutput:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Tokens reserved for a reply
        supportsTemperature:
          type: boolean
          description: >-
            False when the Model fixes its temperature and rejects any other
            value
        prices:
          $ref: '#/components/schemas/ModelPrices'
      required:
        - id
        - label
        - provider
        - contextWindow
        - maxOutput
        - supportsTemperature
        - prices
      additionalProperties: false
    ModelPrices:
      type: object
      properties:
        input:
          type: number
          description: USD per million input tokens
        cachedInput:
          type: number
          description: USD per million input tokens served from the prompt cache
        output:
          type: number
          description: USD per million output tokens
      required:
        - input
        - cachedInput
        - output
      additionalProperties: false
    ProfileImageSettings:
      type: object
      properties:
        uploadsEnabled:
          type: boolean
          description: >-
            Whether this server can store uploads; removing an image works
            either way
      required:
        - uploadsEnabled
      additionalProperties: false
    ProfileImage:
      type: object
      properties:
        image:
          type: string
          format: uri
          description: The public URL of the processed 256×256 WebP
      required:
        - image
      additionalProperties: false
    LogLevelReports:
      type: object
      properties:
        receivers:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: >-
            How many server instances received the request; more than reports
            means some did not answer in time
        reports:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/LogLevelReport'
          description: One per instance that answered, by instance
      required:
        - receivers
        - reports
      additionalProperties: false
    LogLevelReport:
      type: object
      properties:
        instance:
          type: string
          description: The server instance, as its hostname and process id
        levels:
          maxItems: 7
          type: array
          items:
            $ref: '#/components/schemas/LogLevelState'
          description: The root level, then every component
      required:
        - instance
        - levels
      additionalProperties: false
    LogLevelState:
      type: object
      properties:
        target:
          type: string
          enum:
            - root
            - auth
            - chat
            - http
            - llm
            - otel
            - redis
          description: The root level, or the `nebula.component` this level applies to
        level:
          type: string
          enum:
            - fatal
            - error
            - warn
            - info
            - debug
            - trace
            - silent
        expiresAt:
          anyOf:
            - type: string
              format: date-time
              pattern: >-
                ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            - type: 'null'
          description: When the runtime change reverts; `null` at the boot-time level
        operator:
          description: Who asked for the runtime change; `null` at the boot-time level
          type:
            - string
            - 'null'
      required:
        - target
        - level
        - expiresAt
        - operator
      additionalProperties: false
    LogLevelChange:
      type: object
      properties:
        receivers:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: How many server instances received the change
        expiresAt:
          description: When the change reverts
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - receivers
        - expiresAt
      additionalProperties: false
    Admin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        email:
          type: string
          format: email
          pattern: >-
            ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        name:
          type: string
        twoFactorEnabled:
          type: boolean
          description: >-
            Whether they have enrolled in two-factor authentication, without
            which the admin API refuses them
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - email
        - name
        - twoFactorEnabled
        - createdAt
      additionalProperties: false
    AdminUserPage:
      type: object
      properties:
        users:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        nextCursor:
          anyOf:
            - type: string
              format: uuid
              pattern: >-
                ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
        hasMore:
          type: boolean
      required:
        - users
        - nextCursor
        - hasMore
      additionalProperties: false
    AdminUserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - registered
            - unverified
            - admin
            - banned
            - pendingDeletion
            - guest
          description: 'The first that applies: guest, banned, admin, unverified, registered'
        twoFactorEnabled:
          type: boolean
        messagesSent:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Messages the User sent, across their Sessions
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - email
        - name
        - status
        - twoFactorEnabled
        - messagesSent
        - createdAt
        - updatedAt
      additionalProperties: false
    AdminUserDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - registered
            - unverified
            - admin
            - banned
            - pendingDeletion
            - guest
          description: 'The first that applies: guest, banned, admin, unverified, registered'
        twoFactorEnabled:
          type: boolean
        messagesSent:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Messages the User sent, across their Sessions
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        ban:
          anyOf:
            - type: object
              properties:
                reason:
                  type:
                    - string
                    - 'null'
                expiresAt:
                  anyOf:
                    - type: string
                      format: date-time
                      pattern: >-
                        ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    - type: 'null'
                  description: '`null` for a ban with no end'
              required:
                - reason
                - expiresAt
              additionalProperties: false
            - type: 'null'
          description: '`null` unless the User is banned now'
        pendingDeletionAt:
          anyOf:
            - type: string
              format: date-time
              pattern: >-
                ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            - type: 'null'
          description: >-
            When the User asked to delete the account; it is Purged 30 days
            later. `null` unless pending
        sessionsCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - id
        - email
        - name
        - status
        - twoFactorEnabled
        - messagesSent
        - createdAt
        - updatedAt
        - ban
        - pendingDeletionAt
        - sessionsCount
      additionalProperties: false
    AuditPage:
      type: object
      properties:
        entries:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
          description: Newest first
        nextCursor:
          anyOf:
            - type: string
              format: uuid
              pattern: >-
                ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
        hasMore:
          type: boolean
      required:
        - entries
        - nextCursor
        - hasMore
      additionalProperties: false
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: >-
            ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        actorType:
          type: string
          enum:
            - admin
            - operator
            - system
        actorUserId:
          anyOf:
            - type: string
              format: uuid
              pattern: >-
                ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
          description: The Admin who acted; `null` for the Operator or the system
        action:
          type: string
          enum:
            - admin.granted
            - user.role_changed
            - user.banned
            - user.unbanned
            - user.restored
            - session.read
            - run.read
        targetType:
          type: string
        targetId:
          type: string
        detail:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
          description: Ids and changed fields; never Message content
        createdAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - actorType
        - actorUserId
        - action
        - targetType
        - targetId
        - detail
        - createdAt
      additionalProperties: false
paths:
  /:
    get:
      operationId: getApiRoot
      summary: API root
      tags:
        - Health
      description: Welcome endpoint — confirms the API is reachable.
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      description: Returns server liveness status and current UTC timestamp.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/sessions/{sessionId}/messages:
    post:
      operationId: sendMessage
      summary: Send message
      tags:
        - Chat
      description: >-
        Send a user Message to one of the caller’s own Sessions. The Message is
        persisted and its reply is queued; nothing waits on the model. Read the
        reply as server-sent events from `GET /api/streams/{streamId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                mode:
                  type: string
                  enum:
                    - direct
                    - run
                  description: >-
                    How the reply is produced: `direct`, a Direct reply, or
                    `run`, a Run (Registered users only).
                model:
                  description: >-
                    Binds the Session to this Model before replying; omitted
                    keeps the Session's Model
                  type: string
                  enum:
                    - gpt-4o
                    - gpt-4o-mini
                    - gpt-4-turbo
                    - gpt-4.1
                    - gpt-4.1-mini
                    - gpt-5
                    - gpt-5-mini
                    - gpt-5.6-luna
                    - claude-3-5-sonnet-20241022
                    - claude-3-5-haiku-20241022
                    - claude-3-opus-20240229
              required:
                - content
                - mode
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: sessionId
          required: true
      responses:
        '202':
          description: Message persisted and its reply queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          description: Invalid request body or session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Guest message allowance reached, or a Guest asked for a Run —
            registration required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Session is archived — restore it first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Message exceeds the prompt token limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/chat/message-allowance:
    get:
      operationId: getMessageAllowance
      summary: Get message allowance
      tags:
        - Chat
      description: >-
        How much of the caller's message allowance is left. Metered users
        (Guests and unverified Registered users) get their limit, live count and
        remaining sends; verified Registered users get `metered: false`.
      responses:
        '200':
          description: The caller's message allowance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAllowance'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/sessions:
    post:
      operationId: createSession
      summary: Create session
      tags:
        - Sessions
      description: Create a new session with a title
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
              required:
                - title
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listSessions
      summary: List sessions
      tags:
        - Sessions
      description: >-
        Retrieve the caller’s own sessions with cursor-based pagination. Returns
        up to 10 sessions by default; archived sessions are excluded unless
        `archived=true`.
      parameters:
        - schema:
            default: 10
            description: Number of sessions to fetch (1-100, default 10)
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          description: Number of sessions to fetch (1-100, default 10)
        - schema:
            description: Pagination cursor for fetching the next page of sessions
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: cursor
          description: Pagination cursor for fetching the next page of sessions
        - schema:
            description: >-
              Return only archived Sessions (`true`) instead of only active ones
              (default)
            default: 'false'
            type: string
            enum:
              - 'true'
              - 'false'
          in: query
          name: archived
          description: >-
            Return only archived Sessions (`true`) instead of only active ones
            (default)
      responses:
        '200':
          description: Paginated list of sessions owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/sessions/search:
    get:
      operationId: searchSessions
      summary: Search sessions
      tags:
        - Sessions
      description: >-
        Search the caller’s own sessions by title or Message content, ordered by
        creation date. A match inside a Message adds a `snippet` around it.
        Archived sessions are excluded unless `archived=true`.
      parameters:
        - schema:
            type: string
            minLength: 1
            description: Search query to filter sessions by title or Message content
          in: query
          name: q
          required: true
          description: Search query to filter sessions by title or Message content
        - schema:
            description: >-
              Return only archived Sessions (`true`) instead of only active ones
              (default)
            default: 'false'
            type: string
            enum:
              - 'true'
              - 'false'
          in: query
          name: archived
          description: >-
            Return only archived Sessions (`true`) instead of only active ones
            (default)
      responses:
        '200':
          description: Matching sessions owned by the caller
          content:
            application/json:
              schema:
                maxItems: 100
                type: array
                items:
                  $ref: '#/components/schemas/SessionSearchResult'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/sessions/{sessionId}/archive:
    post:
      operationId: archiveSession
      summary: Archive session
      tags:
        - Sessions
      description: >-
        Archive one of the caller’s own sessions: hidden from the session list,
        kept unchanged. Idempotent.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: sessionId
          required: true
      responses:
        '200':
          description: Session archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/sessions/{sessionId}/restore:
    post:
      operationId: restoreSession
      summary: Restore session
      tags:
        - Sessions
      description: Restore one of the caller’s own archived sessions. Idempotent.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: sessionId
          required: true
      responses:
        '200':
          description: Session restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get session by ID
      tags:
        - Sessions
      description: Retrieve one of the caller’s own sessions by ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: sessionId
          required: true
      responses:
        '200':
          description: Session retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/messages:
    post:
      operationId: createMessage
      summary: Create message
      tags:
        - Messages
      description: Create a new message in one of the caller’s own sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  format: uuid
                  pattern: >-
                    ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                role:
                  type: string
                  enum:
                    - user
                    - assistant
                content:
                  type: string
                  minLength: 1
                tokenCount:
                  anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
              required:
                - sessionId
                - role
                - content
      responses:
        '201':
          description: Message created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Session is archived — restore it first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listMessages
      summary: List messages
      tags:
        - Messages
      description: >-
        Retrieve the messages across the caller’s own sessions, newest first.
        Pass `sessionId` to list one session’s messages, oldest first; a session
        the caller does not own lists as empty.
      parameters:
        - schema:
            description: Only list the messages of this session, oldest first
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: sessionId
          description: Only list the messages of this session, oldest first
      responses:
        '200':
          description: List of messages owned by the caller
          content:
            application/json:
              schema:
                maxItems: 1000
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get message by ID
      tags:
        - Messages
      description: Retrieve one of the caller’s own messages by ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: messageId
          required: true
      responses:
        '200':
          description: Message retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid message ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Message not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/models:
    get:
      operationId: getModelCatalog
      summary: Get the model catalog
      tags:
        - Models
      description: >-
        The model catalog: the Models a Session can be bound to, with their
        labels, limits and list prices (USD per million tokens), plus the
        catalog version and content hash
      responses:
        '200':
          description: The model catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalog'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/streams/{streamId}:
    get:
      operationId: readReplyStream
      summary: Read reply stream
      tags:
        - Streams
      description: >-
        Relay a reply stream as server-sent events, from its first event (or
        after `Last-Event-ID`) to its `end` (ADR-0014). Only the User who sent
        the Message may read it. A stream that has expired answers 404: read the
        persisted Message instead.
      parameters:
        - schema:
            description: Resume after this event id, for a client reconnecting by hand
            type: string
            pattern: ^\d+-\d+$
          in: query
          name: lastEventId
          description: Resume after this event id, for a client reconnecting by hand
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: streamId
          required: true
        - schema:
            description: >-
              Resume after this event id; sent by an EventSource when it
              reconnects
            type: string
            pattern: ^\d+-\d+$
          in: header
          name: last-event-id
          description: >-
            Resume after this event id; sent by an EventSource when it
            reconnects
      responses:
        '200':
          description: The reply stream, as server-sent events
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Server-sent events: `token` ({ token }), `usage` ({
                  promptTokens, completionTokens, totalTokens }), `error` (the
                  ErrorEnvelope) and a final `end` ({}, or { reason: 'cancelled'
                  } for a reply its User stopped). Each event `id` is its stream
                  entry id; send the last one back as `Last-Event-ID` (or
                  `lastEventId`) to resume after it.
        '400':
          description: Invalid stream ID or Last-Event-ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Stream not found, expired, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/streams/{streamId}/cancel:
    post:
      operationId: cancelReplyStream
      summary: Cancel reply stream
      tags:
        - Streams
      description: >-
        Stop a Direct reply in flight: the worker aborts the model call,
        persists what it had produced and ends the stream with `end` { reason:
        "cancelled" }. Cancelling a reply that already finished does nothing.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: streamId
          required: true
      responses:
        '204':
          description: Stop requested, or the reply had already finished
        '400':
          description: Invalid stream ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Stream not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/profile-image/settings:
    get:
      operationId: getProfileImageSettings
      summary: Get Profile image settings
      tags:
        - Profile image
      description: Whether this server can store Profile image uploads.
      responses:
        '200':
          description: Profile image settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileImageSettings'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/profile-image:
    put:
      operationId: uploadProfileImage
      summary: Upload Profile image
      tags:
        - Profile image
      description: >-
        Set the Registered user's Profile image from a JPEG, PNG or WebP of up
        to 5 MB, sent as the raw request body. It is stored as a 256×256 WebP;
        the previous upload is deleted.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Profile image stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileImage'
        '400':
          description: The file is not a JPEG, PNG or WebP image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: A Guest cannot set a Profile image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Profile image uploads are switched off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: The file is larger than 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: The body is not a JPEG, PNG or WebP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many uploads this hour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: removeProfileImage
      summary: Remove Profile image
      tags:
        - Profile image
      description: >-
        Remove the Registered user's Profile image, so their Avatar shows
        initials. Succeeds when there is none.
      responses:
        '204':
          description: Profile image removed
        '401':
          description: No auth session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: A Guest cannot have a Profile image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/internal/log-level:
    get:
      operationId: getLogLevels
      summary: Get log levels
      tags:
        - Operator
      description: >-
        Report the root log level and every component's, with the expiry and
        operator of any runtime change, from every running server instance. Each
        instance answers for itself; one that does not answer within 2 seconds
        is left out, so `receivers` exceeds the number of reports. Requires the
        operator token, not a User session.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The levels each server instance applies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelReports'
        '403':
          description: Missing or wrong operator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No operator token is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: changeLogLevel
      summary: Change log level
      tags:
        - Operator
      description: >-
        Change the root log level, or one component's, on every running server
        instance. It reverts to the boot-time level after `ttlSeconds`. Requires
        the operator token, not a User session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                component:
                  description: >-
                    The `nebula.component` to change; omit it to change the root
                    level
                  type: string
                  enum:
                    - auth
                    - chat
                    - http
                    - llm
                    - otel
                    - redis
                level:
                  type: string
                  enum:
                    - fatal
                    - error
                    - warn
                    - info
                    - debug
                    - trace
                ttlSeconds:
                  default: 900
                  description: How long the change holds before the boot-time level returns
                  type: integer
                  minimum: 1
                  maximum: 14400
                operator:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Who is asking, recorded on the lines that log the change
              required:
                - level
                - operator
      security:
        - operatorToken: []
      responses:
        '202':
          description: Change sent to every server instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelChange'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing or wrong operator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No operator token is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/internal/admins:
    get:
      operationId: listAdmins
      summary: List Admins
      tags:
        - Operator
      description: List every Admin. Requires the operator token, not a User session.
      security:
        - operatorToken: []
      responses:
        '200':
          description: Every Admin, oldest account first
          content:
            application/json:
              schema:
                maxItems: 100
                type: array
                items:
                  $ref: '#/components/schemas/Admin'
        '403':
          description: Missing or wrong operator token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No operator token is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: grantAdmin
      summary: Grant Admin
      tags:
        - Operator
      description: >-
        Make a verified Registered user an Admin, and record it in the Audit log
        with the Operator as actor. This is how the first Admin is made.
        Requires the operator token, not a User session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: The email of the verified Registered user to make an Admin
                  type: string
                  format: email
                  pattern: >-
                    ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - email
      security:
        - operatorToken: []
      responses:
        '201':
          description: The user is now an Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          description: Invalid body, or the user is a Guest, unverified or banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing or wrong operator token
          content:
            application/json:
              schema: {}
        '404':
          description: No operator token is configured, or no user has that email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The user is already an Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {}
  /api/internal/admins/{email}:
    delete:
      operationId: revokeAdmin
      summary: Revoke Admin
      tags:
        - Operator
      description: >-
        Take the Admin role from a user, and record it in the Audit log with the
        Operator as actor. Requires the operator token, not a User session.
      parameters:
        - schema:
            description: The email of the Admin
            type: string
            format: email
            pattern: >-
              ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          in: path
          name: email
          required: true
          description: The email of the Admin
      security:
        - operatorToken: []
      responses:
        '204':
          description: The user is no longer an Admin
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing or wrong operator token
          content:
            application/json:
              schema: {}
        '404':
          description: No operator token is configured, or no user has that email
          content:
            application/json:
              schema: {}
        '409':
          description: The user is not an Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {}
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List Users
      tags:
        - Admin
      description: >-
        List Users, newest first by default, filtered by status and a name or
        email search, a page at a time. Guests are left out unless
        `status=guest`. Requires an Admin whose auth session passed two-factor
        authentication.
      parameters:
        - schema:
            description: Case-insensitive text to find in the name or email
            type: string
            minLength: 1
            maxLength: 100
          in: query
          name: search
          description: Case-insensitive text to find in the name or email
        - schema:
            description: >-
              Only Users in this status; without it every User but Guests is
              listed
            type: string
            enum:
              - registered
              - unverified
              - admin
              - banned
              - pendingDeletion
              - guest
          in: query
          name: status
          description: >-
            Only Users in this status; without it every User but Guests is
            listed
        - schema:
            default: createdAt
            description: >-
              `lastActiveAt` is the last update to the account until activity is
              tracked
            type: string
            enum:
              - createdAt
              - lastActiveAt
              - messagesSent
          in: query
          name: sortBy
          description: >-
            `lastActiveAt` is the last update to the account until activity is
            tracked
        - schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
          in: query
          name: order
        - schema:
            default: 10
            description: Number of Users to fetch (1-100, default 10)
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          description: Number of Users to fetch (1-100, default 10)
        - schema:
            description: The `nextCursor` of the previous page
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: cursor
          description: The `nextCursor` of the previous page
      responses:
        '200':
          description: A page of Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Not an Admin (`Forbidden`), or an Admin short of two-factor
            (`TwoFactorRequired`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/users/{id}:
    get:
      operationId: getUser
      summary: Get a User
      tags:
        - Admin
      description: >-
        Read one User: status, two-factor state, ban, Sessions and messages
        sent, and timestamps. Requires an Admin whose auth session passed
        two-factor authentication.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            description: The User id
          in: path
          name: id
          required: true
          description: The User id
      responses:
        '200':
          description: The User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not signed in
          content:
            application/json:
              schema: {}
        '403':
          description: >-
            Not an Admin (`Forbidden`), or an Admin short of two-factor
            (`TwoFactorRequired`)
          content:
            application/json:
              schema: {}
        '404':
          description: No User has that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {}
  /api/admin/users/{id}/restore:
    post:
      operationId: restoreUser
      summary: Restore a User
      tags:
        - Admin
      description: >-
        Restore a User in Pending deletion in full, and record it in the Audit
        log. Requires an Admin whose auth session passed two-factor
        authentication.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            description: The User id
          in: path
          name: id
          required: true
          description: The User id
      responses:
        '204':
          description: The User is no longer pending deletion
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not signed in
          content:
            application/json:
              schema: {}
        '403':
          description: >-
            Not an Admin (`Forbidden`), or an Admin short of two-factor
            (`TwoFactorRequired`)
          content:
            application/json:
              schema: {}
        '404':
          description: No User has that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The User is not pending deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {}
  /api/admin/users/{id}/role:
    post:
      operationId: setUserRole
      summary: Grant or revoke Admin
      tags:
        - Admin
      description: >-
        Grant or revoke the Admin role, and record it in the Audit log. A Guest,
        an unverified or a banned user cannot become an Admin
        (`NotEligibleForAdmin`), and the last Admin cannot be revoked
        (`LastAdmin`). Requires an Admin whose auth session passed two-factor
        authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - admin
                    - user
                  description: '`admin` grants the role, `user` revokes it'
              required:
                - role
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            description: The User id
          in: path
          name: id
          required: true
          description: The User id
      responses:
        '204':
          description: The role is changed
        '400':
          description: Invalid id or body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not signed in
          content:
            application/json:
              schema: {}
        '403':
          description: >-
            Not an Admin (`Forbidden`), or an Admin short of two-factor
            (`TwoFactorRequired`)
          content:
            application/json:
              schema: {}
        '404':
          description: No User has that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: >-
            Already (or not) an Admin (`Conflict`), not eligible
            (`NotEligibleForAdmin`) or the last Admin (`LastAdmin`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {}
  /api/admin/users/{id}/ban:
    post:
      operationId: banUser
      summary: Ban a User
      tags:
        - Admin
      description: >-
        Ban a User with a reason and an optional end time, revoke every auth
        session of theirs, and record it in the Audit log. Their sign-in then
        fails with the reason and end time until the ban ends or is lifted. The
        last Admin cannot be banned (`LastAdmin`). Sessions are revoked through
        Redis secondary storage; a cookie-cache holder may stay signed in for up
        to five minutes, as with Sign out everywhere. Requires an Admin whose
        auth session passed two-factor authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Shown to the User when they try to sign in
                expiresAt:
                  description: >-
                    When the ban ends; without it the ban lasts until an Admin
                    lifts it
                  type: string
                  format: date-time
                  pattern: >-
                    ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              required:
                - reason
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            description: The User id
          in: path
          name: id
          required: true
          description: The User id
      responses:
        '204':
          description: The User is banned
        '400':
          description: Invalid id or body, or the Admin banning themselves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not signed in
          content:
            application/json:
              schema: {}
        '403':
          description: >-
            Not an Admin (`Forbidden`), or an Admin short of two-factor
            (`TwoFactorRequired`)
          content:
            application/json:
              schema: {}
        '404':
          description: No User has that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Already banned (`Conflict`) or the last Admin (`LastAdmin`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {}
  /api/admin/users/{id}/unban:
    post:
      operationId: unbanUser
      summary: Unban a User
      tags:
        - Admin
      description: >-
        Lift a ban, and record it in the Audit log. Requires an Admin whose auth
        session passed two-factor authentication.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            description: The User id
          in: path
          name: id
          required: true
          description: The User id
      responses:
        '204':
          description: The User is no longer banned
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not signed in
          content:
            application/json:
              schema: {}
        '403':
          description: >-
            Not an Admin (`Forbidden`), or an Admin short of two-factor
            (`TwoFactorRequired`)
          content:
            application/json:
              schema: {}
        '404':
          description: No User has that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The User is not banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {}
  /api/admin/audit:
    get:
      operationId: listAuditEntries
      summary: List Audit log
      tags:
        - Admin
      description: >-
        List Audit log entries, newest first, filtered by actor, action, target
        and time range, a page at a time. Requires an Admin whose auth session
        passed two-factor authentication.
      parameters:
        - schema:
            description: Only entries by this kind of actor
            type: string
            enum:
              - admin
              - operator
              - system
          in: query
          name: actorType
          description: Only entries by this kind of actor
        - schema:
            description: Only entries by this Admin
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: actorUserId
          description: Only entries by this Admin
        - schema:
            type: string
            enum:
              - admin.granted
              - user.role_changed
              - user.banned
              - user.unbanned
              - user.restored
              - session.read
              - run.read
          in: query
          name: action
        - schema:
            description: Only entries about this kind of record, e.g. `user`
            type: string
            minLength: 1
            maxLength: 50
          in: query
          name: targetType
          description: Only entries about this kind of record, e.g. `user`
        - schema:
            description: Only entries about this record
            type: string
            minLength: 1
            maxLength: 100
          in: query
          name: targetId
          description: Only entries about this record
        - schema:
            description: Only entries at or after this time
            type: string
            format: date-time
            pattern: >-
              ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          in: query
          name: from
          description: Only entries at or after this time
        - schema:
            description: Only entries before this time
            type: string
            format: date-time
            pattern: >-
              ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          in: query
          name: to
          description: Only entries before this time
        - schema:
            default: 10
            description: Number of entries to fetch (1-100, default 10)
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          description: Number of entries to fetch (1-100, default 10)
        - schema:
            description: The `nextCursor` of the previous page
            type: string
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: cursor
          description: The `nextCursor` of the previous page
      responses:
        '200':
          description: A page of Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Not an Admin (`Forbidden`), or an Admin short of two-factor
            (`TwoFactorRequired`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
