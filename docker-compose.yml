services:
  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5332:5432"
    volumes: # kics-scan ignore-line
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint starts as root, chowns the data dir, then drops to `postgres`.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    container_name: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes: # kics-scan ignore-line
      - redis-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Same root-then-drop entrypoint: chown /data, then switch to `redis`.
    # DAC_OVERRIDE lets root traverse the redis-owned 0700 appendonlydir.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Local OTLP backend: Grafana, Tempo and Loki, no Collector, traces linked to their log lines.
  # The app only speaks OTLP to OTEL_EXPORTER_OTLP_ENDPOINT, so swapping it is env (ADR-0007/0023).
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    container_name: otel-lgtm
    ports:
      # Grafana UI — 3001 on the host because the server itself defaults to 3000.
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes: # kics-scan ignore-line
      - otel-lgtm-data:/data
      # The repo's dashboards (grafana/), provisioned into a "Nebula Chat" folder.
      - ./grafana/provisioning/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/nebula-chat.yml:ro
      - ./grafana/dashboards:/otel-lgtm/nebula-chat-dashboards:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Matches the hardening on db/redis. Every process in this image binds an
    # unprivileged port, so it starts and goes healthy with no capabilities.
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  redis-data:
  otel-lgtm-data:
