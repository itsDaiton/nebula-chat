services:
  - type: web
    name: nebula-chat-server
    runtime: node
    rootDir: .
    plan: free
    # Without a region Render creates a service in Oregon; the server, worker and their data stay together.
    region: frankfurt
    # Node 26 no longer bundles Corepack, so pnpm is provisioned with the npm
    # that ships with the runtime. Keep the version in step with the
    # `packageManager` pin in package.json.
    #
    # db:migrate runs here rather than as a preDeployCommand because those are
    # paid-plan only; on free the build is the one hook available before boot.
    # A migration failure therefore reports as "build failed" — check the tail
    # of the log for the Postgres error, which db:migrate prints in full.
    buildCommand: npm install -g pnpm@12.4.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@nebula-chat/server && pnpm --filter @nebula-chat/db db:migrate
    # Start does not need pnpm: the build already produced dist/, so keep the
    # boot path free of a network install. The cd reproduces the working
    # directory "pnpm --filter" used to set, which the server relies on to
    # resolve ../../openapi/package.json.
    startCommand: cd apps/server && node dist/src/server.js
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      # The worker's public URL. The server pings its /health on every enqueue,
      # which is what wakes a sleeping free-plan worker (ADR-0013).
      - key: WORKER_URL
        sync: false

  # Produces every LLM reply (ADR-0013). The free plan has no background
  # workers, so it runs as a web service whose only route is /health; it sleeps
  # without inbound HTTP and the server's ping wakes it. It holds the LLM keys;
  # the server holds none. Migrations stay with the server's build.
  - type: web
    name: nebula-chat-worker
    runtime: node
    rootDir: .
    plan: free
    # Next to the server and Redis: every reply token is a Redis write the next one waits on.
    region: frankfurt
    buildCommand: npm install -g pnpm@12.4.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@nebula-chat/worker
    startCommand: cd apps/worker && node dist/src/worker.js
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # At least one of the two LLM keys.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: nebula-chat-client
    runtime: static
    rootDir: .
    buildCommand: npm install -g pnpm@12.4.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@nebula-chat/client
    staticPublishPath: apps/client/build
    # SPA fallback: deep links (/c/:id, and the emailed /auth/verify-email and
    # /auth/reset-password links) must serve index.html, not a 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    pullRequestPreviewsEnabled: true
    autoDeployTrigger: off

# Optional environment variables can be managed in Render dashboard/secrets.
# Keep Root Directory at repo root for pnpm workspace catalog resolution.
# The Node version comes from .nvmrc.
