name: Deploy nebula-chat-client

# The client bundles @nebula-chat/errors, so an errors release changes what it serves; its Orval
# output is committed, so an openapi release does not. validate-deploy-triggers.yml checks this list.
on:
  push:
    tags:
      - 'nebula-chat-client-v*'
      - 'nebula-chat-errors-v*'
  workflow_dispatch:

permissions: {}

# One release pushes several tags at once, each firing its own run.
concurrency:
  group: deploy-nebula-chat-client
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy nebula-chat-client
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: curl -fSs --retry 3 -X POST "$DEPLOY_HOOK"
