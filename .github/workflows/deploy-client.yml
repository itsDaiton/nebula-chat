name: Deploy nebula-chat-client

# Unlike the server, the client depends on no workspace packages — its Orval
# output is committed under apps/nebula-chat-client — so its own tag is the
# only release that changes what it serves.
on:
  push:
    tags: ['nebula-chat-client-v*']
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy nebula-chat-client
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: curl -fSs --retry 3 -X POST "$DEPLOY_HOOK"
