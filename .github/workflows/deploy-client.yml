name: Deploy nebula-chat-client

# The client bundles @nebula-chat/errors at build time, so an errors release
# changes what it serves, as a lib release does for the server. Its Orval output
# is committed under apps/client, so an openapi release alone does not.
# `validate-deploy-triggers.yml` keeps this tag list in step with its
# `workspace:*` dependencies.
on:
  push:
    tags:
      - 'nebula-chat-client-v*'
      - 'nebula-chat-errors-v*'
  workflow_dispatch:

permissions: {}

# One release pushes several tags at once, each firing its own run.
concurrency:
  group: deploy-nebula-chat-client
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy nebula-chat-client
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: curl -fSs --retry 3 -X POST "$DEPLOY_HOOK"
