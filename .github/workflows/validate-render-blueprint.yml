name: Validate Render Blueprint

on:
  pull_request:
    paths:
      - render.yaml
      - .github/workflows/validate-render-blueprint.yml
  push:
    branches:
      - main
    paths:
      - render.yaml
      - .github/workflows/validate-render-blueprint.yml
  workflow_dispatch:

permissions: {}

jobs:
  validate-blueprint:
    name: Validate render.yaml schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Download Render schema
        run: curl -fsSL https://render.com/schema/render.yaml.json -o render.schema.json

      # ajv-cli 5 parses YAML with js-yaml 3's `safeLoad`, but `pnpm dlx` run
      # from the repo root applies the workspace `js-yaml: ^4` override, where
      # `safeLoad` is removed. ajv-cli then falls back to `require()`-ing the
      # file and fails with "Unexpected token ':'". Converting with yq (on the
      # runner image) hands ajv plain JSON and keeps it out of YAML parsing.
      - name: Convert render.yaml to JSON
        run: yq -o=json '.' render.yaml > render.json

      - name: Validate render.yaml against Render schema
        run: pnpm dlx ajv-cli validate --spec=draft2020 --strict=false -s render.schema.json -d render.json
