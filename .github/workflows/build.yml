name: Build

# Deliberately NO `paths:` filter. `build-result` is the required status check,
# and a workflow that never triggers never reports one — so a PR touching only
# docs, .claude/, or another workflow would sit blocked forever waiting for a
# check that cannot arrive. Instead this always runs, and the `changes` job
# below resolves the matrix: when nothing buildable changed the matrix is empty,
# the build legs skip, and `build-result` still reports success.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A push to a PR branch (or another quick push to main) supersedes the previous
# commit's build before it finishes. Without this, every superseded run still
# runs the full matrix (lint/format/typecheck/build/test/Sonar per package) to
# completion, burning Actions minutes on a result nobody will look at.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_changes: ${{ steps.set.outputs.has_changes }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            client:
              - 'apps/nebula-chat-client/**'
            server:
              - 'apps/nebula-chat-server/**'
              - 'libs/**'
            auth:
              - 'libs/auth/**'
            db:
              - 'libs/db/**'
            langchain:
              - 'libs/langchain/**'
            otel:
              - 'libs/otel/**'
            redis:
              - 'libs/redis/**'
            # `scripts/` belongs to no workspace package, so it is outside the
            # build matrix and gets its own lint/format/typecheck job below.
            scripts:
              - 'scripts/**'
              - 'tsconfig.scripts.json'
              - 'eslint.config.ts'
              - 'prettier.config.cjs'
            # Root-level files that change how every package is installed,
            # linted, typechecked or built — any of these rebuilds everything.
            shared:
              - 'scripts/post-sonar-quality-comment.ts'
              - '.github/workflows/build.yml'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.npmrc'
              - 'eslint.config.ts'
              - 'prettier.config.cjs'
              - 'tsconfig.eslint.json'
              - 'tsconfig.scripts.json'
              - 'turbo.json'
              - 'knip.json'
      - name: Compute build matrix
        id: set
        env:
          EVENT: ${{ github.event_name }}
          F_CLIENT: ${{ steps.filter.outputs.client }}
          F_SERVER: ${{ steps.filter.outputs.server }}
          F_AUTH: ${{ steps.filter.outputs.auth }}
          F_DB: ${{ steps.filter.outputs.db }}
          F_LANGCHAIN: ${{ steps.filter.outputs.langchain }}
          F_OTEL: ${{ steps.filter.outputs.otel }}
          F_REDIS: ${{ steps.filter.outputs.redis }}
          F_SHARED: ${{ steps.filter.outputs.shared }}
        run: |
          set -euo pipefail
          # `coverage` mirrors that package's `vitest.config` coverage.exclude,
          # so Sonar and Vitest measure the same denominator. They cannot be one
          # shared list: `logger.ts` is excluded in server and langchain but is the
          # main tested unit in otel, and `env.ts` is excluded in server but is the
          # only real logic in db. Change one, change the other.
          all='[
            {"id":"client","name":"nebula-chat-client","dir":"apps/nebula-chat-client","filter":"nebula-chat-client","lint":"apps/nebula-chat-client/","key":"itsDaiton_nebula-chat-client","project":"Nebula-Chat-Client","coverage":"src/main.tsx,src/vite-env.d.ts,src/theme/**,src/libs/api/generated/**,src/test/**,src/**/tests/**,src/**/*.types.ts,src/**/types/**,src/shared/components/ui/prose.tsx,src/shared/components/ui/provider.tsx,src/shared/components/ui/toaster.tsx,src/shared/components/ui/code-block-adapter.ts,src/shared/components/scrollbar.ts,src/resources.ts"},
            {"id":"server","name":"nebula-chat-server","dir":"apps/nebula-chat-server","filter":"nebula-chat-server","lint":"apps/nebula-chat-server/","key":"itsDaiton_nebula-chat-server","project":"Nebula-Chat-Server","coverage":"src/**/tests/**,src/test/**,src/server.ts,src/app.ts,src/logger.ts,src/env.ts,src/db.ts,src/auth.ts,src/generated/**,src/scripts/**,src/**/*.types.ts,src/**/*.repository.ts"},
            {"id":"auth","name":"nebula-chat-auth","dir":"libs/auth","filter":"@nebula-chat/auth","lint":"libs/auth/","key":"itsDaiton_nebula-chat-auth","project":"Nebula-Chat-Auth","coverage":"src/**/tests/**,src/index.ts,src/auth.ts"},
            {"id":"db","name":"nebula-chat-db","dir":"libs/db","filter":"@nebula-chat/db","lint":"libs/db/","key":"itsDaiton_nebula-chat-db","project":"Nebula-Chat-DB","coverage":"src/**/tests/**,src/index.ts,src/schema.ts,src/client.ts,src/migrate.ts,src/baseline.ts"},
            {"id":"langchain","name":"nebula-chat-langchain","dir":"libs/langchain","filter":"@nebula-chat/langchain","lint":"libs/langchain/","key":"itsDaiton_nebula-chat-langchain","project":"Nebula-Chat-LangChain","coverage":"src/**/tests/**,src/index.ts,src/logger.ts"},
            {"id":"otel","name":"nebula-chat-otel","dir":"libs/otel","filter":"@nebula-chat/otel","lint":"libs/otel/","key":"itsDaiton_nebula-chat-otel","project":"Nebula-Chat-OTel","coverage":"src/**/tests/**,src/index.ts,src/tracing.ts"},
            {"id":"redis","name":"nebula-chat-redis","dir":"libs/redis","filter":"@nebula-chat/redis","lint":"libs/redis/","key":"itsDaiton_nebula-chat-redis","project":"Nebula-Chat-Redis","coverage":"src/**/tests/**,src/index.ts,src/connection.ts,src/factory.ts,src/metrics.ts"}
          ]'
          # Non-PR runs (push to main, manual) and any change to shared
          # files build everything; PRs build only the changed packages.
          if [ "$EVENT" != "pull_request" ] || [ "$F_SHARED" = "true" ]; then
            selected="$all"
          else
            ids='[]'
            if [ "$F_CLIENT" = "true" ]; then ids=$(echo "$ids" | jq -c '. + ["client"]'); fi
            if [ "$F_SERVER" = "true" ]; then ids=$(echo "$ids" | jq -c '. + ["server"]'); fi
            if [ "$F_AUTH" = "true" ]; then ids=$(echo "$ids" | jq -c '. + ["auth"]'); fi
            if [ "$F_DB" = "true" ]; then ids=$(echo "$ids" | jq -c '. + ["db"]'); fi
            if [ "$F_LANGCHAIN" = "true" ]; then ids=$(echo "$ids" | jq -c '. + ["langchain"]'); fi
            if [ "$F_OTEL" = "true" ]; then ids=$(echo "$ids" | jq -c '. + ["otel"]'); fi
            if [ "$F_REDIS" = "true" ]; then ids=$(echo "$ids" | jq -c '. + ["redis"]'); fi
            selected=$(echo "$all" | jq -c --argjson ids "$ids" '[.[] | select(.id as $i | $ids | index($i))]')
          fi
          matrix=$(echo "$selected" | jq -c '{include: .}')
          count=$(echo "$selected" | jq 'length')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building: $(echo "$selected" | jq -r '[.[].name] | join(", ")')"

  build:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.name }}-
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Lint
        env:
          MATRIX_LINT: ${{ matrix.lint }}
        run: pnpm exec eslint --report-unused-disable-directives --max-warnings=0 "$MATRIX_LINT"
      - name: Format check
        env:
          MATRIX_LINT: ${{ matrix.lint }}
        run: pnpm exec prettier --check "$MATRIX_LINT"
      - name: TypeScript check
        env:
          MATRIX_FILTER: ${{ matrix.filter }}
        run: pnpm turbo run typecheck --filter="$MATRIX_FILTER"
      - name: Build
        env:
          MATRIX_FILTER: ${{ matrix.filter }}
        run: pnpm turbo run build --filter="$MATRIX_FILTER"
      # After Build: the `test` task depends on ^build, so workspace libraries are
      # exercised as their published dist artifact rather than as source (ADR-0008).
      # Vitest's own coverage thresholds fail this step below 80%, which is the
      # real gate — the Sonar steps below are skipped without SONAR_TOKEN, so a
      # Sonar-only gate would not apply to dependabot or fork PRs.
      - name: Test
        env:
          MATRIX_FILTER: ${{ matrix.filter }}
        run: pnpm turbo run test --filter="$MATRIX_FILTER" -- --coverage
      # Sonar steps are guarded on SONAR_TOKEN: dependabot/fork PRs do not
      # receive the secret, so Sonar is skipped (not failed) there while
      # lint/typecheck/build still gate the PR.
      # `-Dsonar.coverage.exclusions` is `matrix.coverage`, which mirrors the
      # package's vitest.config coverage.exclude. A file excluded from one gate
      # and not the other makes "80% enforced twice" two different numbers.
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: ${{ matrix.dir }}
          args: >
            -Dsonar.projectKey=${{ matrix.key }}
            -Dsonar.organization=itsdaiton
            -Dsonar.projectName=${{ matrix.project }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/generated/**
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/tests/**,**/test/**,**/*.test.ts,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=${{ matrix.coverage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate quality gate
        id: quality_gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        with:
          scanMetadataReportFile: ${{ matrix.dir }}/.scannerwork/report-task.txt
          pollingTimeoutSec: 300
      - name: Publish Sonar summary
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        env:
          MATRIX_DIR: ${{ matrix.dir }}
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_KEY: ${{ matrix.key }}
          QUALITY_GATE_STATUS: ${{ steps.quality_gate.outputs.quality-gate-status }}
        run: |
          report_file="${MATRIX_DIR}/.scannerwork/report-task.txt"
          dashboard_url=''
          if [ -f "${report_file}" ]; then
            dashboard_url="$(grep '^dashboardUrl=' "${report_file}" | cut -d= -f2-)"
          fi

          {
            echo '## Sonar Scan Summary'
            echo ''
            echo "- Package: ${MATRIX_NAME}"
            echo "- Project key: ${MATRIX_KEY}"
            echo "- Quality gate: ${QUALITY_GATE_STATUS}"
            if [ -n "${dashboard_url}" ]; then
              echo "- Dashboard: ${dashboard_url}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Comment quality gate in PR
        if: ${{ always() && github.event_name == 'pull_request' && env.SONAR_TOKEN != '' }}
        run: pnpm exec tsx scripts/post-sonar-quality-comment.ts
        env:
          APP_NAME: ${{ matrix.name }}
          SONAR_PROJECT_KEY: ${{ matrix.key }}
          SONAR_QUALITY_GATE_STATUS: ${{ steps.quality_gate.outputs.quality-gate-status }}
          SONAR_REPORT_PATH: ${{ matrix.dir }}/.scannerwork/report-task.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # `scripts/` is in no workspace package, so the build matrix cannot reach it.
  # It has no build and no tests by design — it is executed on every build leg by
  # the Sonar comment step — but it is still TypeScript that CI must check.
  scripts:
    name: scripts
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Lint
        run: pnpm exec eslint --report-unused-disable-directives --max-warnings=0 scripts/
      - name: Format check
        run: pnpm exec prettier --check scripts/
      - name: TypeScript check
        run: pnpm exec tsc -p tsconfig.scripts.json

  # Single always-run gate that reflects whether every triggered leg passed —
  # the build matrix and the scripts job alike. Make THIS the required status
  # check in branch protection: the per-package legs only run when their
  # package changed, so requiring one directly would hang PRs that don't
  # touch it.
  build-result:
    name: build-result
    needs: [build, scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify build result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
        run: |
          echo "build result: ${BUILD_RESULT}"
          echo "scripts result: ${SCRIPTS_RESULT}"
          # 'skipped' means nothing in that job's scope changed -> pass.
          for result in "${BUILD_RESULT}" "${SCRIPTS_RESULT}"; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              exit 1
            fi
          done
