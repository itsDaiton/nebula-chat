name: Ticket
description: File a feature or fix. Every unit of work in this repo is a GitHub issue an agent can pick up cold.
title: 'type(scope): short summary'
labels: ['needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Issues are the single source of truth for work here — the `/triage` → `/implement` flow reads them
        directly, and an agent may pick one up with **no other context**. Write it so that's enough: be
        specific, link the ADRs and files that matter, and spell out done. More detail is better than less.

        **Title** — Conventional Commit shape, `type(scope): summary`. Once filed, this issue **is** ticket
        `NEB-<issue-number>` (issue `#341` → `NEB-341`), and its title is edited to carry that ID:
        `type(scope): NEB-<n>: summary` — e.g. `feat(server): NEB-330: migrate Express to Fastify`. That
        exact string becomes the PR title Release Please parses, so `type` must be `feat`/`fix` (`!` for a
        breaking/major change).

        **Labels** — this form applies `needs-triage`. During `/triage` a maintainer adds the area/lib
        labels (`app:server`, `app:client`, `lib:db`, …) and a triage state (`ready-for-agent` /
        `ready-for-human` / `needs-info`). See [`docs/agents/triage-labels.md`](https://github.com/itsDaiton/nebula-chat/blob/main/docs/agents/triage-labels.md).
  - type: dropdown
    id: change-type
    attributes:
      label: Change type
      description: The Conventional Commit type for the eventual PR title. Only feat and fix are released; `!` marks a breaking (major) change.
      options:
        - feat — new capability
        - fix — bug fix or corrected behaviour
        - feat! — new capability, breaking (major version)
        - fix! — bug fix, breaking (major version)
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences. What should be true after this ships that isn't true today?
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background & problem
      description: The current state and why it's not good enough. What breaks, what's missing, what a user or agent hits today. Link related issues and ADRs (`docs/adr/NNNN-*.md`). For a bug, include reproduction steps.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The packages/areas this ticket touches and what changes in each. Keep the table; add or remove rows.
      value: |
        | Area / package | What changes |
        | -------------- | ------------ |
        | `apps/nebula-chat-server` |  |
        | `libs/…` |  |
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: A concrete, checkable definition of done — an agent should be able to verify each line, and a reviewer sign off against it. Cover the happy path, the error paths, and tests.
      value: |
        - [ ]
        - [ ]
        - [ ] Tests cover the behaviour at its seam(s)
    validations:
      required: true
  - type: textarea
    id: technical-approach
    attributes:
      label: Technical approach & notes
      description: Hints for whoever implements it cold — the files/modules likely involved, the pattern to follow, gotchas, the ADR that governs the decision. Not a line-by-line plan; the decision-rich pointers.
    validations:
      required: false
  - type: input
    id: dependencies
    attributes:
      label: Depends on
      description: Other tickets that must land first, by ID — e.g. `NEB-330, NEB-333`. Leave blank if it can start immediately.
      placeholder: None (can start immediately)
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope / non-goals
      description: What this ticket explicitly does NOT do, to keep the change focused and reviewable.
    validations:
      required: false
