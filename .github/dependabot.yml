version: 2

updates:
  # Root package (pnpm monorepo — covers all workspace packages)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 10
    # TS 7 is blocked on typescript-eslint support (NEB-392); remove this then.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Docker Compose images (local dev services)
  - package-ecosystem: "docker-compose"
    directory: "/apps/nebula-chat-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # A Postgres major needs a dump/restore of the pgdata volume; bump it by hand.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose-dependencies:
        patterns:
          - "*"
