packages:
  - apps/*
  - libs/*
  - openapi

catalog:
  '@dotenvx/dotenvx': ^2.38.2
  '@opentelemetry/api': ^1.10.0
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/coverage-v8': ^5.0.5
  better-auth: 1.7.12
  bullmq: ^6.4.0
  drizzle-orm: ^0.45.4
  msw: ^3.0.3
  nodemon: ^3.1.14
  orval: ^8.44.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tiktoken: ^1.0.0
  tsc-alias: ^1.9.8
  tsdown: ^0.23.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.0.5
  zod: ^4.6.6

# CLI & Node.js ---------------------------------------------------------------
engineStrict: true
nodeVersion: 26.12.1

# Build -----------------------------------------------------------------------
allowBuilds:
  argon2: true
  esbuild: true
  # Optional native msgpack speed-up pulled in by bullmq; the pure-JS fallback is enough.
  msgpackr-extract: false
  msw: true
  protobufjs: true

# Dependency resolution -------------------------------------------------------
minimumReleaseAge: 14400
minimumReleaseAgeExclude:
  - remeda
  # Security patches younger than minimumReleaseAge; drop once they age past it.
  - fast-uri@3.1.9
  - fast-uri@4.2.3
  - markdown-it@14.3.3
  - undici@6.29.1
  - undici@7.30.1
  - undici@8.12.2
  - glob@14.0.3
  - minimatch@11.0.3
  - '@isaacs/nonrecursive-glob-match@1.0.3'
  - path-scurry@3.0.0
  - follow-redirects@1.16.2

ignoredOptionalDependencies:
  - prisma
  - '@prisma/client'

overrides:
  effect: 3.20.0
  lodash: 4.18.1
  '@hono/node-server': ^1.19.13
  hono: 4.12.25
  path-to-regexp: 8.4.0
  msw>path-to-regexp: ^6.3.0
  fast-xml-parser: '>=5.7.0'
  flatted: 3.4.2
  uuid: '>=14.0.0'
  langsmith: '>=0.5.19'
  esbuild: 0.28.1
  '@anthropic-ai/sdk': '>=0.91.1'
  js-yaml: ^4.3.2
  source-map-js: ^1.2.2
  '@scalar/json-magic>undici': ^7.30.1
  fast-uri@3: ^3.1.9
  fast-uri@4: ^4.2.3
  markdown-it@14: ^14.3.3
  undici@6: ^6.29.1
  undici@7: ^7.30.1
  undici@8: ^8.12.2
  zod@4: ^4.6.6
  glob@10: ^14.0.2
  glob@13: ^14.0.2
  minimatch@9: ^11.0.1
  minimatch@10: ^11.0.1
  seroval: ^1.6.11
  systeminformation: ^5.33.16
  follow-redirects: ^1.16.2
