packages:
  - apps/*
  - libs/*
  - openapi

catalog:
  '@dotenvx/dotenvx': ^2.33.0
  '@types/node': ^26.6.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/coverage-v8': ^5.0.3
  better-auth: 1.7.7
  drizzle-orm: ^0.45.3
  react: ^19.3.0
  react-dom: ^19.3.0
  tsdown: ^0.23.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.0.3
  zod: ^4.6.5

# CLI & Node.js ---------------------------------------------------------------
engineStrict: true
nodeVersion: 26.8.2

# Build -----------------------------------------------------------------------
allowBuilds:
  argon2: true
  esbuild: true
  msw: true
  protobufjs: true

# Dependency resolution -------------------------------------------------------
minimumReleaseAge: 14400
minimumReleaseAgeExclude:
  - remeda

ignoredOptionalDependencies:
  - prisma
  - '@prisma/client'

overrides:
  effect: 3.20.0
  lodash: 4.18.1
  '@hono/node-server': ^1.19.13
  hono: 4.12.25
  path-to-regexp: 8.4.0
  msw>path-to-regexp: ^6.3.0
  fast-xml-parser: '>=5.7.0'
  flatted: 3.4.2
  uuid: '>=14.0.0'
  langsmith: '>=0.5.19'
  esbuild: 0.28.1
  '@anthropic-ai/sdk': '>=0.91.1'
  js-yaml: ^4.3.2
  source-map-js: ^1.2.2
  '@scalar/json-magic>undici': ^7.29.1
