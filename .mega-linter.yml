# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation
---
# all, none, or list of linter keys
APPLY_FIXES: all

# If you use ENABLE variable, all other languages/formats/tooling-formats will
# be disabled by default
# ENABLE:

# If you use ENABLE_LINTERS variable, all other linters will be disabled by
# default
# ENABLE_LINTERS:

DISABLE:
  - COPYPASTE # Uncomment to disable checks of excessive copy-pastes
  - SPELL # Uncomment to disable checks of spelling mistakes

# MegaLinter bundles its own ESLint in /node-deps, which cannot load this repo's
# eslint.config.ts: it needs `jiti` for a TypeScript config file and does not
# ship it, so both descriptors abort with "Oops! Something went wrong!" on every
# PR that touches a .ts or .tsx file, having linted nothing. Installing jiti into
# its image would only get it as far as our plugins, which it also lacks.
# `.github/workflows/build.yml` already runs ESLint with the repo's own
# toolchain and config against every package, so this removes a duplicate that
# never worked rather than lint coverage.
DISABLE_LINTERS:
  - TYPESCRIPT_ES
  - TSX_ESLINT

# Vendored agent skills (see skills-lock.json) are held byte-identical to their
# upstream source, so lint findings in them are not actionable. FILTER_REGEX_EXCLUDE
# covers the file-list linters; ADDITIONAL_EXCLUDED_DIRECTORIES (basename-matched at
# any depth) covers the project-scope ones such as devskim and checkov.
# `scripts/` holds the repo's own CI helper scripts. They belong to no workspace
# package and are neither built nor tested, but they are linted, format-checked
# and typechecked by the `scripts` job in build.yml, which `build-result` gates
# on. MegaLinter would only duplicate that against a ruleset `eslint.config.ts`
# contradicts (see TYPESCRIPT_STANDARD_FILTER_REGEX_EXCLUDE).
FILTER_REGEX_EXCLUDE: '(\.claude/skills/|^scripts/|/scripts/)'
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - skills
  # MegaLinter's own output: `APPLY_FIXES` copies every fixed file into
  # megalinter-reports/updated_sources/, and the project-scope linters have no
  # business re-scanning those copies. (This was also a guess at why checkov
  # reports each openapi.yaml finding twice; it is not the cause — the
  # duplication survives this exclusion and remains unexplained.)
  - megalinter-reports

# DS173237: skills-lock.json records a SHA-256 per vendored skill, which DevSkim
# reads as 37 hardcoded tokens. Secret detection is already covered by
# betterleaks, secretlint, trufflehog and kingfisher, so the rule is redundant.
# DS126858 (weak hash): the only match is the substring `mD4` inside a base64
# integrity hash in pnpm-lock.yaml. Nothing in this repo uses MD4.
REPOSITORY_DEVSKIM_ARGUMENTS: ["--ignore-rule-ids", "DS173237", "DS126858"]

# jsonlint is strict JSON. Every tsconfig in this repo is JSONC — tsconfig.app.json
# has carried `/* Bundler mode */` comments since it was generated — so jsonlint
# fails to parse them by design. v8r and prettier still validate these files, and
# both understand JSONC.
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: '(tsconfig.*\.json$)'

# spectral lints OpenAPI documents. Pointed at the repo it picks up
# pnpm-lock.yaml and reports "Expected a single document in the stream" — it is
# linting a lockfile as an API spec. The real spec lives in openapi/.
API_SPECTRAL_FILTER_REGEX_INCLUDE: '^openapi/'

# pnpm-lock.yaml is generated: its long dependency-resolution lines trip
# yamllint's 500-character limit and are not ours to reformat.
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: '(pnpm-lock\.yaml$)'

# zizmor's impostor-commit audit resolves every `uses:` against the GitHub API,
# which answers 401 for the unauthenticated linter and aborts the whole run
# ("fatal: no audit was performed") — so none of its other audits report either.
# Offline mode drops that one audit and keeps the rest, without handing the
# linter a token.
ACTION_ZIZMOR_ARGUMENTS: --offline

TYPESCRIPT_STANDARD_ARGUMENTS: -p tsconfig.eslint.json

# ts-standard's ruleset contradicts this repo's own ESLint config on test code,
# and eslint.config.ts is the documented source of truth (AGENTS.md). Most
# notably it demands @typescript-eslint/explicit-function-return-type, which
# eslint.config.ts explicitly sets to 'off'. It also rejects the non-null
# assertions that noUncheckedIndexedAccess forces when indexing mock calls, and
# flags a deliberate non-Error promise rejection in a test that exists precisely
# to prove such a rejection gets wrapped.
#
# The repo's own `pnpm lint` covers these files and passes, so this excludes
# only the duplicate, conflicting opinion — not the linting itself.
#
# `/tests?/` covers both the shared `src/test/` harness and the per-module
# `tests/` folders. `/generated/` is the Orval output, which eslint.config.ts
# already ignores for the same reason: it is regenerated from the OpenAPI
# document on every backend change and is not hand-editable.
#
# `\.config\.[cm]?tsx?$` is excluded for a different reason. It matches every
# package-root config file — vite, vitest, orval, drizzle, tsup — and
# tsconfig.eslint.json covers only `src/**` per package, so a file at a package
# root belongs to no lint TSConfig and ts-standard cannot parse it at all
# ("that TSConfig does not include this file"). eslint.config.ts ignores them
# for exactly this reason.
TYPESCRIPT_STANDARD_FILTER_REGEX_EXCLUDE: '(\.test\.tsx?$|/tests?/|/generated/|\.config\.[cm]?tsx?$)'

SHOW_ELAPSED_TIME: true

# Uncomment if you want MegaLinter to detect errors but not block CI to pass
# DISABLE_ERRORS: true
